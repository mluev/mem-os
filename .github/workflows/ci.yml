name: ci

on:
  pull_request:
  push:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.12.3 }
      - uses: actions/setup-node@v4
        with: { node-version: 22.12 }
      - run: pnpm --dir sdk/typescript install --frozen-lockfile
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }
      - run: uv python install 3.12
      - run: uv sync --all-groups --locked
      - run: uv run ruff check src tests tools integrations/hermes eval
      - run: uv run ruff format --check src tests tools integrations/hermes eval
      - run: uv run pytest -q --cov=memkit --cov-report=term-missing --cov-fail-under=75
      - run: uv run python -m eval.golden --schema-only
      - run: uv run python -m eval.semantic --schema-only
      - run: uv run python -m eval.semantic --schema-only --corpus eval/corpora/multiscenario-v1.json
      - run: uv run python -m eval.reports check docs/experiments/runs
      - run: uv run python tools/export_openapi.py && git diff --exit-code -- openapi.json
      - run: uv run python -m tools.docblocks --check
      - run: uv export --locked --no-dev --no-emit-project -o /tmp/memkit-requirements.txt
      - run: uv run pip-audit -r /tmp/memkit-requirements.txt

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
        with: { version: 9.12.3 }
      - uses: actions/setup-node@v4
        with: { node-version: 22.12, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: uv python install 3.12
      - run: uv sync --all-groups --locked
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web gen:api && git diff --exit-code -- web/src/api/schema.d.ts openapi.json
      - run: pnpm --dir web lint
      - run: pnpm --dir web typecheck
      - run: pnpm --dir web test
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - run: pnpm --dir web test:e2e
      - run: pnpm --dir web build
      - run: pnpm --dir web audit --audit-level high

  qdrant:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.18.2
        ports: ["6333:6333"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: uv sync --all-groups --locked
      - run: MEMKIT_QDRANT_INTEGRATION=1 uv run pytest -q tests/test_qdrant_integration.py

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
        with: { version: 9.12.3 }
      - uses: actions/setup-node@v4
        with: { node-version: 22.12 }
      - run: uv python install 3.12
      - run: uv sync --all-groups --locked
      - run: pnpm --dir web install --frozen-lockfile && pnpm --dir web build
      - run: pnpm --dir sdk/typescript install --frozen-lockfile
      - run: pnpm --dir web gen:api && cp web/src/api/schema.d.ts sdk/typescript/src/schema.d.ts
      - run: uv run openapi-python-client generate --path openapi.json --meta uv --output-path sdk/python --overwrite --fail-on-warning
      - run: uv run python tools/normalize_python_sdk.py
      - run: git diff --exit-code -- openapi.json web/src/api/schema.d.ts sdk/typescript/src/schema.d.ts sdk/python
      - run: pnpm --dir sdk/typescript build
      - run: pnpm --dir sdk/typescript pack --pack-destination /tmp
      - run: test -f sdk/typescript/dist/schema.d.ts
      - run: uv run python tools/smoke_typescript_sdk.py /tmp/memkit-sdk-*.tgz
      - run: uv build --project sdk/python
      - run: uv build
      - run: |
          python -m venv /tmp/memkit-clean
          /tmp/memkit-clean/bin/pip install dist/*.whl
          /tmp/memkit-clean/bin/python -c 'from memkit.api import app; assert any(getattr(r,"path","")=="/ui" for r in app.routes)'
          mkdir -p /tmp/hermes
          /tmp/memkit-clean/bin/memkit install-hermes --hermes-home /tmp/hermes
          test -f /tmp/hermes/plugins/memkit/plugin.yaml
          python -m venv /tmp/memkit-python-sdk
          /tmp/memkit-python-sdk/bin/pip install sdk/python/dist/*.whl
          /tmp/memkit-python-sdk/bin/python -c 'from memkit_client import AuthenticatedClient; c=AuthenticatedClient(base_url="http://localhost",token="k"); r=c.get_httpx_client().build_request("GET","/"); assert r.headers["X-API-Key"]=="k" and "Authorization" not in r.headers'
