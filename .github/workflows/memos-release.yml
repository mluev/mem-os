name: memos-release

on:
  push:
    tags: ['memos-v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: uv build --project cli
      - run: uv run --project cli python tools/sync_cli_assets.py --check
      - run: uv run --project cli --with pytest python -m pytest -q cli/tests
      - name: Verify release tag matches CLI version
        run: uv run --project cli python -c 'import os; from memos_cli import __version__; assert os.environ["GITHUB_REF_NAME"] == "memos-v" + __version__'
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
      - name: Attach standalone CLI to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" cli/dist/* --generate-notes
