[project]
name = "memos-cli"
version = "0.1.0"
description = "Lightweight universal client for hosted Mem OS"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1", "PyYAML>=6,<7"]

[project.scripts]
memos = "memos_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memos_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
extend = "../pyproject.toml"
extend-exclude = ["src/memos_cli/claude_hooks.py", "src/memos_cli/claude_classifier.py", "src/memos_cli/scrub.py", "src/memos_cli/assets/hermes"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603"]
"src/memos_cli/server.py" = ["S603", "S607", "S105"]
"src/memos_cli/cli.py" = ["S105"]
"src/memos_cli/assets/server_worker.py" = ["S603", "S104"]
