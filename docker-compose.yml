services:
  qdrant:
    image: qdrant/qdrant:v1.18.2
    container_name: memkit-qdrant
    # Bound to loopback only. The service is single-user and must not be
    # reachable from the network.
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

volumes:
  qdrant_storage:
