# Golden set for the extractor: hand-written windows with a known right answer.
#
# Without this, comparing prompt versions is eyeballing. The real corpus tells us
# what a variant *did*; only this tells us whether it was *correct*.
#
# Written in the style of the real corpus deliberately: a coding agent, mixed
# Russian and English, long assistant work logs, corrections buried in short user
# replies. Content is invented, not copied.
#
# Each case declares:
#   expect  — facts that must be found. `text` is a regex (case-insensitive).
#             `scope` / `type` are checked when given.
#   reject  — patterns that must NOT appear in any emitted fact.
#   max_ops — a ceiling; more than this means the variant is padding.
#
# Cases are grouped by the behaviour they probe, which is what makes a failure
# actionable rather than just a lower score.

# ---------------------------------------------------------------- direct signal
- id: direct-preference
  probes: a plainly stated preference
  project: memkit
  messages:
    - [user, "давай использовать pnpm везде, npm я не хочу видеть в проекте"]
    - [assistant, "Понял, перевожу на pnpm. Обновлю lockfile и CI."]
  expect:
    - text: "pnpm"
      scope: user
      type: preference
  reject: ["lockfile", "CI"]
  max_ops: 2

- id: identity-fact
  probes: identity, should score high importance
  project: cine
  messages:
    - [user, "мой github это mluev, почта mluev@example.com, если нужно для CI"]
    - [assistant, "Записал, добавлю в конфиг деплоя."]
  expect:
    - text: "mluev"
      scope: user
      type: fact
      min_importance: 0.7
  max_ops: 2

- id: project-structure
  probes: a project-scoped structural fact
  project: memkit
  messages:
    - [user, "запомни: авторизация у нас лежит в auth/ и работает на session cookie, не на JWT"]
    - [assistant, "Понял. Учту при добавлении middleware."]
  expect:
    - text: "auth/"
      scope: project
  reject: ["middleware"]
  max_ops: 2

# ------------------------------------------------------- preference by rejection
- id: correction-implies-preference
  probes: the richest signal — a preference hidden in a correction
  project: frontend
  messages:
    - [assistant, "Я задисейблил кнопку Submit пока форма невалидна, так пользователь не отправит битые данные."]
    - [user, "нет, не надо так. пусть жмёт и видит ошибки валидации, а не гадает почему кнопка мертвая"]
    - [assistant, "Понял, убираю disabled, добавляю вывод ошибок после submit."]
  expect:
    - text: "(disabl|неактивн|валидац|validation)"
      scope: user
      type: preference
  max_ops: 2

- id: correction-abstraction
  probes: rejection of over-engineering as a durable working style
  project: memkit
  messages:
    - [assistant, "Вынес это в отдельный composable useUserSelection с фабрикой и инжектором зависимостей, чтобы было переиспользуемо."]
    - [user, "зачем? есть же company store. не надо плодить абстракции ради одного места"]
    - [assistant, "Убрал composable, использую существующий store."]
  expect:
    - text: "(абстракц|abstraction|существующ|existing|store)"
      scope: user
  max_ops: 2

# -------------------------------------------------------------- must extract NOT
- id: assistant-worklog-only
  probes: prompt rule 4 — a window of pure assistant narration
  project: core
  messages:
    - [assistant, "Прочитал 18 файлов, обновил роутер, добавил 10 стабов вью. Прогнал type-check: 0 ошибок в новых файлах, 6 pre-existing в легаси."]
    - [assistant, "Прогнал lint. Prettier переформатировал файлы, это ожидаемо. Осталось 6 ошибок в легаси-коде, не мои."]
    - [assistant, "Смержил PR #203, починил 3 устаревших тест-сюита. 162/162 сюита зелёные, 1541 тест."]
    - [user, "go on"]
    - [assistant, "Продолжаю: следующая фаза — сертификаты."]
  expect: []
  reject: ["PR #?203", "162", "1541", "prettier", "lint"]
  max_ops: 0

- id: transient-state
  probes: prompt rule on transient states — mood is not a memory
  project: notiky
  messages:
    - [user, "я сегодня уставший, давай что-нибудь простое поделаем"]
    - [assistant, "Хорошо, возьмём мелкие багфиксы."]
    - [user, "ага давай"]
  expect: []
  reject: ["(устал|tired|сегодня|today)"]
  max_ops: 1

- id: one-off-question
  probes: asking about X once is not interest in X
  project: notiky
  messages:
    - [user, "а что такое tRPC вообще? чем от graphql отличается"]
    - [assistant, "tRPC — это типизированный RPC для TypeScript-монорепо. В отличие от GraphQL нет схемы и резолверов, типы выводятся напрямую из роутера на сервере."]
    - [user, "ясно"]
  expect: []
  reject: ["(tRPC|graphql)"]
  max_ops: 1

# ------------------------------------------------------------------- credentials
- id: credentials-must-not-leak
  probes: prompt rule 9 — extract intent, never the value
  project: core
  messages:
    - [user, "запомни мой ключ для стейджа AWS_SECRET_ACCESS_KEY=wJalrXUtnFEMIK7MDENGbPxRfiCYEXAMPLEKEY и токен ghp_16CharsExampleTokenAAAAAAAAAAAAAAAAA"]
    - [assistant, "Не буду сохранять секреты. Положи их в .env, я добавлю в gitignore."]
  reject: ["wJalrXUtnFEMIK7", "ghp_16Chars", "AAAAAAAAAAAA"]
  max_ops: 1

# --------------------------------------------------------------- update vs add
- id: contradicts-candidate
  probes: prompt rule 6 — refine an existing fact, do not duplicate it
  project: frontend
  candidates:
    - id: cand-react-1
      text: "Uses React for frontend work"
      type: preference
      importance: 0.7
  messages:
    - [user, "я месяц назад слез с реакта, вью норм заходит. везде теперь vue 3"]
    - [assistant, "Понял, перепишу компоненты на Vue 3 SFC."]
  expect:
    - text: "vue"
      op: UPDATE
      id: cand-react-1
  max_ops: 2

# ------------------------------------------------------------------ mixed window
- id: mixed-user-and-project
  probes: one window carrying both a personal preference and a project decision
  project: frontend-second
  messages:
    - [user, "мне не нравится как выглядит модалка расписания. слишком широкая, и чекбоксы нативные"]
    - [assistant, "Перевёрстываю: ширина 720px, заменяю нативные чекбоксы на app-switch."]
    - [user, "да, и вообще всегда используй app-switch вместо нативных чекбоксов, у нас так во всей системе"]
    - [assistant, "Понял, зафиксирую как правило."]
  expect:
    - text: "app-switch"
      scope: user
    - text: "(модалк|modal|расписан|schedule)"
  max_ops: 3

# Was "the memory must be in the user's language" (old rule 9). That rule is gone:
# measured on the full corpus, 20% of input is Russian but only 6% of facts were,
# so it was being ignored ~70% of the time. Retrieval does not need it -- a Russian
# query reaches the matching English fact at rank 1, which is what BGE-M3 was
# chosen for -- and one language makes dedup and consolidation comparable.
# What still has to hold is that Russian input yields a *correct* fact at all.
- id: russian-input-yields-a-fact
  probes: a Russian-only window must still produce the right content, in any language
  project: cine
  messages:
    - [user, "все кнопки, которые запускают подписание и отправку, давайте унифицируем под один лейбл «Подписать и отправить»"]
    - [assistant, "Понял, унифицирую лейблы."]
  expect:
    - text: "(подписан|подпис|sign|унифиц|unif|лейбл|label)"
  max_ops: 2

# ------------------------------------------------------------ importance spread
- id: hard-constraint
  probes: a hard constraint should land near the top of the importance range
  project: memkit
  messages:
    - [user, "у меня 16 гигов на маке, локальные llm мы запускать не будем никогда. только API"]
    - [assistant, "Понял, судья через API, локально только эмбеддинги."]
  expect:
    - text: "(локальн|local|16|API)"
      min_importance: 0.7
  max_ops: 2

# ------------------------------------------------- scope priming (added for v5)
# Reproduces the failure the short cases missed: a long, project-heavy window
# that also carries a personal preference. v4 scored 6/6 on scope here in the
# short cases yet dropped to 11% user-scope on the real corpus, so the golden set
# needed a case where project context genuinely dominates the window.
- id: preference-buried-in-project-work
  probes: a personal preference inside a window dominated by one codebase
  project: frontend-second
  messages:
    - [assistant, "Открыл LmsCourseEditor.vue, LmsTestEditor.vue и LmsFlowEditor.vue. Обновил роутер, добавил редиректы со старых edit-роутов на query-param."]
    - [assistant, "Прогнал type-check по модулю LMS: 0 ошибок. Prettier переформатировал 4 файла."]
    - [user, "ок. и вообще на будущее — я не люблю когда логика раскидана по хелперам, держи всё рядом с местом использования пока не станет реально много"]
    - [assistant, "Понял, инлайню обратно в компоненты."]
    - [assistant, "Готово: убрал 3 хелпера, логика теперь в LmsCourseEditor.vue."]
  expect:
    - text: "(хелпер|helper|рядом|colocat|inline|локальн)"
      scope: user
      type: preference
  reject: ["prettier", "type-check", "0 ошибок"]
  max_ops: 2

- id: project-fact-stays-project
  probes: the reverse — a genuinely project-scoped fact must not drift to user
  project: memkit
  messages:
    - [user, "SQLite у нас источник правды, Qdrant — производный индекс, его можно всегда пересобрать из базы"]
    - [assistant, "Понял, добавлю команду reindex."]
  expect:
    - text: "(sqlite|qdrant)"
      scope: project
  max_ops: 2

# ============================================================ scope drift, hard
# Added after the full-corpus run: 41 of 62 facts came back scope=project, and
# ~17 of those were personal preferences, leaving 34% of the store reachable
# without naming a project. The short cases above score 8/8 on scope and did not
# see it — project context has to genuinely dominate the window before the drift
# appears.
#
# The measured tell is syntactic: the model writes "For frontend-second, prefers
# modal dialogs with tabs" — a general preference grammatically bound to one
# repository. So these cases reject that prefix outright, not just the wrong
# scope field.

- id: drift-preference-in-heavy-project-window
  probes: a general UI preference stated inside a long single-repo work log
  project: frontend-second
  messages:
    - [assistant, "Прошёлся по модулю LMS: LmsCourseEditor.vue, LmsTestEditor.vue, LmsFlowEditor.vue, LmsAttemptsTable.vue. Обновил роутер, добавил редиректы со старых edit-роутов."]
    - [assistant, "type-check по модулю: 0 ошибок. Prettier переформатировал 6 файлов. Прогнал unit-тесты — 84/84 зелёные."]
    - [assistant, "Вынес редактор курса на отдельную страницу /lms/courses/:id/edit, как было в старом роутере."]
    - [user, "не надо отдельной страницей. редакторы всегда выноси в модалку с табами — так во всех наших продуктах, и мне так удобнее держать контекст списка"]
    - [assistant, "Понял, переношу в модалку. Табы: Основное, Задания, Доступ."]
    - [assistant, "Готово: LmsCourseEditor.vue теперь drawer 880px, роут удалён, редирект убран. Обновил 3 места вызова."]
  expect:
    - text: "(модалк|modal|drawer|таб|tab)"
      scope: user
      type: preference
  # The drift signature: a general preference bound to one repo by its wording.
  reject: ["^(For|In) (the )?frontend-second", "prettier", "84/84", "0 ошибок"]
  max_ops: 2

- id: drift-working-style-via-correction
  probes: working style implied by a correction, inside dense project work
  project: notiky
  messages:
    - [assistant, "Нашёл баг в notiky: счётчик попыток не сбрасывался. Добавил фолбэк в компоненте — если бэк вернул null, считаем на клиенте."]
    - [assistant, "Заодно накинул shim для старого формата ответа, чтобы не ломать существующие вызовы."]
    - [user, "нет, так не делай. если данных не хватает — это задача бэкенда, а не шим на клиенте. я не хочу разгребать эти костыли через полгода"]
    - [assistant, "Убираю шим, открываю тикет на бэкенд."]
    - [assistant, "Готово: фолбэк удалён, добавлен тикет NOT-412."]
  expect:
    - text: "(бэкенд|backend|шим|shim|фолбэк|fallback|костыл)"
      scope: user
      type: preference
  reject: ["^(For|In) (the )?notiky", "NOT-412"]
  max_ops: 2

- id: drift-two-facts-one-window-hard
  probes: one personal preference plus one project decision, both required
  project: portfolio
  messages:
    - [assistant, "Собрал страницу продуктов: сетка 3 колонки, картинки грузятся сразу, ширина контента 1200px."]
    - [user, "картинки показывай только по клику на выбранный продукт, иначе страница весит как самолёт"]
    - [assistant, "Понял, ленивая загрузка по клику."]
    - [user, "и ещё — я вообще не люблю переусложнённые абстракции, пиши прямо и коротко, читаемость важнее гибкости"]
    - [assistant, "Принял. Убрал фабрику product-renderer, оставил прямой компонент."]
  expect:
    - text: "(по клику|on click|ленив|lazy)"
      scope: project
    - text: "(переусложн|over-?engineer|читаем|readable|коротк)"
      scope: user
  max_ops: 3

- id: drift-reverse-guard-generic-wording
  probes: a genuinely project-specific fact phrased generically must stay project
  project: notiky
  messages:
    - [user, "тут вход через OTP на почту, пароля нет вообще. в dev используем dev@notiky.local"]
    - [assistant, "Понял, зафиксирую механизм входа."]
  expect:
    - text: "(otp|почт|email)"
      scope: project
  # The one-directional project->user promotion must not fire here.
  max_ops: 2

- id: drift-empty-despite-temptation
  probes: a long window whose only user content is transient — empty is correct
  project: frontend-second
  messages:
    - [assistant, "Прогнал миграции, поднял сиды, накатил тестового тенанта. 12 таблиц, 340 строк."]
    - [assistant, "Собрал прод-бандл: 2.1 MB, gzip 640 KB. Lighthouse 94/100."]
    - [user, "ок, устал уже, давай на сегодня всё, завтра продолжим"]
    - [assistant, "Хорошо, останавливаюсь."]
  expect: []
  max_ops: 0

- id: correction-implies-comment-preference
  probes: the real miss from the corpus — repeated "too much comment" yielded nothing
  project: frontend-second
  messages:
    - [assistant, "Прошёл ревью по модулю. В src/constants/lms.ts:402 добавил блок комментариев, описывающий каждое поле."]
    - [user, "In `src/constants/lms.ts` at line 402: too much comment"]
    - [assistant, "Убрал."]
    - [user, "и в src/utils/lms.ts:19 тоже too much comment. код должен читаться сам, комментарий только там где неочевидно почему"]
    - [assistant, "Понял, сокращаю комментарии по модулю."]
  expect:
    - text: "(комментар|comment)"
      scope: user
      type: preference
  reject: ["^(For|In) (the )?frontend-second", "lms\\.ts:402"]
  max_ops: 2
